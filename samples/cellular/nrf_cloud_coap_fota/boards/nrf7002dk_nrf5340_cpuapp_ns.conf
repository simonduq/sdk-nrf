# Wi-Fi overlay for nRF7002 DK (nRF5340 + nRF7002 companion IC).
# Not compatible with nRF91 series. Requires an _ns (non-secure) board target.
#
# NOTE: MCUboot and FOTA update execution are NOT supported with this overlay.
# The combination of Wi-Fi stack + TF-M + MCUboot + nRF Cloud FOTA exceeds
# the nRF5340's 1MB flash. This is consistent with nrf_cloud_multi_service,
# which also disables FOTA in its Wi-Fi overlays.
# This build connects to nRF Cloud via CoAP and demonstrates shadow and
# configuration, but cannot download or apply firmware updates on this board.
# To restore FOTA: use an nRF91-series board, or reduce other components
# to make room for MCUboot (~130KB) + FOTA download buffer.

## Disable modem/LTE/nRF91-specific features
CONFIG_NRF_MODEM_LIB=n
CONFIG_MODEM_INFO=n
CONFIG_MODEM_INFO_ADD_NETWORK=n
CONFIG_MODEM_KEY_MGMT=n
CONFIG_MODEM_JWT=n
CONFIG_AT_HOST_LIBRARY=n
CONFIG_LTE_LINK_CONTROL=n
CONFIG_AT_MONITOR=n

## Disable offloaded sockets (switch to native networking stack)
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NRF_MODEM_LIB_NET_IF=n

## Disable FOTA and MCUboot (see note at top of file)
CONFIG_NRF_CLOUD_FOTA_POLL=n
CONFIG_NRF_CLOUD_FOTA_FULL_MODEM_UPDATE=n
CONFIG_FOTA_DOWNLOAD=n
CONFIG_DFU_TARGET=n
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_SPI_NOR=n
CONFIG_PM_EXTERNAL_FLASH_MCUBOOT_SECONDARY=n

## Enable TF-M and Trusted Execution for Protected Storage credential storage.
## Note: credentials are still retrieved into insecure memory when in use.
CONFIG_BUILD_WITH_TFM=y
CONFIG_TRUSTED_EXECUTION_NONSECURE=y
CONFIG_TFM_PARTITION_PROTECTED_STORAGE=y

## TF-M profile: NOT_SET + SFN, matching nrf_cloud_multi_service Wi-Fi overlays.
## More flash-efficient than SMALL when paired with the tuned partition sizes below.
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_TFM_IPC=n
CONFIG_TFM_SFN=y
CONFIG_TFM_CRYPTO_CONC_OPER_NUM=4
## Asymmetric signing is required for CoAP JWT generation via PSA crypto.
CONFIG_TFM_CRYPTO_ASYM_SIGN_MODULE_ENABLED=y

## TF-M partition sizes (tuned for Wi-Fi + CoAP, matching multi_service)
CONFIG_PM_PARTITION_SIZE_TFM_INTERNAL_TRUSTED_STORAGE=0x2000
CONFIG_PM_PARTITION_SIZE_TFM_OTP_NV_COUNTERS=0x2000
CONFIG_PM_PARTITION_SIZE_TFM_PROTECTED_STORAGE=0x4000
CONFIG_PM_PARTITION_SIZE_TFM_SRAM=0xC000
CONFIG_PM_PARTITION_SIZE_TFM=0x24000

## Credential shells for Wi-Fi and TLS setup
CONFIG_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI_CREDENTIALS_SHELL=y
CONFIG_TLS_CREDENTIALS_SHELL=y
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y
CONFIG_SHELL_STACK_SIZE=4850
# nRF Cloud credentials can exceed 1024 bytes
CONFIG_TLS_CREDENTIALS_SHELL_CRED_BUF_SIZE=3072
CONFIG_BASE64=y

## Date/time via NTP (no modem clock)
CONFIG_DATE_TIME_AUTO_UPDATE=n
CONFIG_DATE_TIME_MODEM=n
CONFIG_DATE_TIME_NTP=y
CONFIG_DATE_TIME_LOG_LEVEL_DBG=y
CONFIG_DATE_TIME_RETRY_COUNT=5
CONFIG_DATE_TIME_RETRY_INTERVAL_SECONDS=20

## Wi-Fi drivers
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_NRF70_SKIP_LOCAL_ADMIN_MAC=y
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=4850
CONFIG_WIFI_CREDENTIALS=y

## Flash and NVS settings (required by WIFI_CREDENTIALS)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

## Native networking stack
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_NATIVE=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=30000
CONFIG_POSIX_API=y
CONFIG_NET_IPV6=n

## MbedTLS for CoAP/DTLS
CONFIG_MQTT_LIB_TLS=n
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Legacy API is required for RSA
CONFIG_MBEDTLS_LEGACY_CRYPTO_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HEAP_SIZE=80000
CONFIG_MBEDTLS_DTLS=y
CONFIG_MBEDTLS_SSL_SRV_C=y
CONFIG_MBEDTLS_SSL_COOKIE_C=y
CONFIG_MBEDTLS_SSL_DTLS_HELLO_VERIFY=y
CONFIG_MBEDTLS_SSL_DTLS_CONNECTION_ID=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=y

# ECDH/ECDSA are needed for DTLS handshake
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y

# Keep legacy hostap crypto on nRF5340 NS Wi-Fi CoAP builds.
# If we use HOSTAP_CRYPTO_ALT_PSA, hostap selects MBEDTLS_USE_PSA_CRYPTO,
# which routes mbedTLS TLS/X.509 through PSA/TF-M and can break DTLS connect
# to coap.nrfcloud.com (observed as zsock_connect() failure: -111 / ECONNREFUSED).
# Legacy mode keeps the non-PSA mbedTLS TLS path and restores stable cloud connection.
CONFIG_HOSTAP_CRYPTO_ALT_LEGACY_PSA=y

## Disable unused MbedTLS features to save flash/RAM
CONFIG_MBEDTLS_CHACHA20_C=n
CONFIG_MBEDTLS_CHACHAPOLY_C=n
CONFIG_MBEDTLS_POLY1305_C=n
CONFIG_MBEDTLS_SHA1_C=n
CONFIG_MBEDTLS_CIPHER_MODE_CBC=n

## nRF Cloud CoAP with custom JWT (PSA-based, not modem-based)
CONFIG_NRF_CLOUD_MQTT=n
CONFIG_NRF_CLOUD_COAP=y
CONFIG_NRF_CLOUD_JWT_SOURCE_CUSTOM=y

## Device ID from Wi-Fi MAC address (unique per board)
CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_NET_MAC=y
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_HW_ID=y

## CoAP client tuning
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=192
CONFIG_NET_SOCKETS_TLS_SET_MAX_FRAGMENT_LENGTH=y
CONFIG_NET_SOCKETS_OFFLOAD_PRIORITY=40
# Wi-Fi RTT to nRF Cloud can be much higher than on LTE; give CON transfers more time.
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=4000
CONFIG_COAP_MAX_RETRANSMIT=8

## Memory tuning for Wi-Fi
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=30
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8000
CONFIG_HEAP_MEM_POOL_SIZE=40144
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=92856
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_FPU=y
