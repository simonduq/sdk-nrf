# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_NRF71=y
CONFIG_WIFI_CREDENTIALS=y
# Needed for Wi-Fi credentials
CONFIG_FLASH=y
CONFIG_ZMS=y
CONFIG_SETTINGS=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

# Networking
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SOCKETS=y
# IPv4-only Wi-Fi: IPv6 has no route here, and its bring-up multicast/ND on
# wifi connect can wedge the nRF71 Wi-Fi. (nrf_cloud, which works, disables it.)
CONFIG_NET_IPV6=n
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_AI_MAX_ENTRIES=4

# NET sockets
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_MAX_CONN=6
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_ZVFS_POLL_MAX=8
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_MAX_CONTEXTS=3

# NET buffers
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_BUF_RX_COUNT=6
# Scan result storage costs ~256 bytes each; the default 200 (~50 KB) exhausts
# memory during the scan that `wifi connect` triggers -> hang. nrf_cloud keeps
# this at 10.
CONFIG_NRF_WIFI_SCAN_MAX_BSS_CNT=10

# nRF71 Wi-Fi driver buffers/aggregation: leave at defaults (48 RX / 12 TX-agg).
# Shrinking them to 6 / 1 starves the driver -> "Invalid vif_ctx" at init and the
# connect hangs. nrf_cloud (which works) uses the defaults.

# MQTT
CONFIG_MQTT_HELPER_PROVISION_CERTIFICATES=y

# Kernel options
CONFIG_POSIX_NETWORKING=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_NET_L2_WIFI_SHELL=y

# TLS
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_SSL_KEEP_PEER_CERTIFICATE=n
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_CREDENTIALS_BACKEND_VOLATILE=y

# Zephyr NET Connection Manager Connectivity layer.
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n

# POSIX API memory optimizations
CONFIG_POSIX_FD_MGMT=n
CONFIG_POSIX_MESSAGE_PASSING=n
CONFIG_POSIX_THREAD_THREADS_MAX=0

CONFIG_HEAP_MEM_POOL_SIZE=40144
# nRF71 Wi-Fi heaps left at defaults (ctrl 15000 / data 97856). The reduced data
# heap (was 59856) contributes to the Wi-Fi init/connect failure on this driver;
# nrf_cloud uses the defaults.

# THE freeze fix: `wifi connect` is issued from the shell, so the entire connect
# path (Wi-Fi cred storage via PSA/TF-M IPC + conn_mgr bring-up) runs on the shell
# thread's stack. The default 4096 overflows -> NS stack-limit fault -> escalates
# to the secure side, where TF-M's NS-fault service spins -> presents as a hang
# with no console output. Confirmed over J-Link: PSP_NS == PSPLIM_NS exactly at
# the base of shell_uart_stack. nrf_cloud never hits this -- it connects
# programmatically on its own thread, not from the shell.
CONFIG_SHELL_STACK_SIZE=8192

# TF-M secure-crypto config for the AWS TLS handshake that follows (mirrors
# nrf_cloud): the default IOVEC buffer (5120) is too small for the cert-chain PSA
# ops, and X.509 verification needs PSA_ALG_ECDSA_ANY. MM_IOVEC stays off (it
# conflicts with TFM_ITS_ENCRYPTED on nRF7120). NOT the connect-freeze cause.
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=n
CONFIG_TFM_CRYPTO_IOVEC_BUFFER_SIZE=36864
CONFIG_PSA_WANT_ALG_ECDSA_ANY=y
