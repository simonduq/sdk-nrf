# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_CREDENTIALS=y

# Needed for Wi-Fi credentials
CONFIG_FLASH=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y

# WPA supplicant
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LOG_LEVEL_INF=y

# Heap
CONFIG_HEAP_MEM_POOL_SIZE=40144
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y

# Networking
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_CONTEXT_SNDTIMEO=y

# Shell
CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_SHELL_STACK_SIZE=5400

# TLS: TF-M crypto IPC scratch must be large enough for a full TLS record.
# Without this, psa_export_public_key gets a 16 KB output buffer but the
# default 5120-byte scratch overflows -> PSA_ERROR_INSUFFICIENT_MEMORY and
# a silent TLS handshake failure. The larger scratch lives in secure SRAM,
# so sram0_s is grown in the companion .overlay file.
CONFIG_TFM_CRYPTO_IOVEC_BUFFER_SIZE=36864
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_NET_LOG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_ERR=y
# CRACEN auto-enables CHACHA20_POLY1305 and certain ECC algorithms. Clients
# pick these ciphers; psa_import_key then fails unless the matching key types
# and curves are explicitly declared here.
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ALG_ECDSA_ANY=y
CONFIG_PSA_WANT_KEY_TYPE_CHACHA20=y
