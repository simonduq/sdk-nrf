CONFIG_WIFI_NRF71=y
CONFIG_NRF71_RADIO_TEST=y

# Enable the necessary drivers
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y

# Let the non-secure application enter System OFF through TF-M, as needed by
# the "systemoff" shell command.
CONFIG_TFM_SFN=y
CONFIG_TFM_NRF_SYSTEM_OFF_SERVICE=y
