# nRF7120 (SOC_SERIES_NRF71) defaults TFM_ITS_ENCRYPTED=y, which conflicts with
# PSA_FRAMEWORK_HAS_MM_IOVEC (enabled in prj.conf for TF-M RAM savings).
CONFIG_TFM_ITS_ENCRYPTED=n

# FOTA requires MCUBoot; this sample uses BOOTLOADER_NONE on nrf7120dk.
# Disabling NRF_CLOUD_FOTA also avoids pulling in FW_INFO, which has no
# SOC_SERIES_NRF71 defaults and causes both a CMake and a linker error.
CONFIG_NRF_CLOUD_FOTA=n

# Root cause of the TLS handshake failure on /ns: with MM-IOVEC disabled, the
# TF-M crypto partition COPIES each PSA call's in/out vectors into a scratch
# buffer of size CONFIG_TFM_CRYPTO_IOVEC_BUFFER_SIZE. mbedtls hands
# psa_export_public_key an output buffer the size of MBEDTLS_SSL_OUT_CONTENT_LEN
# (16 KB), so the 5120-byte default scratch overflows -> PSA_ERROR_INSUFFICIENT
# _MEMORY (-141). Size the scratch for a full TLS record AEAD op (ciphertext-in
# + plaintext-out, ~16 KB each). Lives in secure RAM -> needs the larger sram0_s.
CONFIG_TFM_CRYPTO_IOVEC_BUFFER_SIZE=36864
