sample:
  name: Wi-Fi nRF Cloud Sample
tests:
  sample.wifi.conn.mqtt:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp/ns
      - nrf7120dk/nrf7120/cpuapp/ns
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp/ns
      - nrf7120dk/nrf7120/cpuapp/ns
    extra_args:
      - EXTRA_CONF_FILE="mqtt.conf"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  sample.wifi.conn.coap.nofota:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7120dk/nrf7120/cpuapp/ns
    platform_allow:
      - nrf7120dk/nrf7120/cpuapp/ns
    extra_args:
      - EXTRA_CONF_FILE="coap.conf"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  # Secure-only (no /ns), no FOTA (coap.conf without coap-fota.conf) and no
  # MCUboot (SB_CONFIG_BOOTLOADER_NONE overrides Kconfig.sysbuild's default
  # of MCUboot for this board target). no-mcuboot.overlay is required: the
  # board's default partition layout reserves the first 64 KB of MRAM for
  # MCUboot and links the app to run from slot0_partition at 0x10000, which
  # only works if MCUboot is actually present at 0x0 to jump there. See the
  # overlay file for details.
  sample.wifi.conn.coap.sonly.nofota:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7120dk/nrf7120/cpuapp
    platform_allow:
      - nrf7120dk/nrf7120/cpuapp
    extra_args:
      - EXTRA_CONF_FILE="coap.conf"
      - SB_CONFIG_BOOTLOADER_NONE=y
      - DTC_OVERLAY_FILE="no-mcuboot.overlay"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  sample.wifi.conn.coap:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp/ns
      - nrf7120dk/nrf7120/cpuapp
    platform_allow:
      - nrf7002dk/nrf5340/cpuapp/ns
      - nrf7120dk/nrf7120/cpuapp
    extra_args:
      - EXTRA_CONF_FILE="coap.conf;coap-fota.conf"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  sample.wifi.conn.nrf7002eb2.mqtt:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54lm20dk/nrf54lm20a/cpuapp/ns
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    platform_allow:
      - nrf54lm20dk/nrf54lm20a/cpuapp/ns
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    extra_args:
      - SHIELD=nrf7002eb2
      - EXTRA_CONF_FILE="mqtt.conf"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  sample.wifi.conn.nrf7002eb2.coap:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54lm20dk/nrf54lm20a/cpuapp/ns
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    platform_allow:
      - nrf54lm20dk/nrf54lm20a/cpuapp/ns
      - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    extra_args:
      - SHIELD=nrf7002eb2
      - EXTRA_CONF_FILE="coap.conf;coap-fota.conf"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
