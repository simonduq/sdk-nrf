sample:
  name: WiFi nRF Cloud Sample
tests:
  sample.wifi.nrf7002ek_wifi.conn:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf5340dk/nrf5340/cpuapp/ns
    platform_allow: nrf5340dk/nrf5340/cpuapp/ns
    extra_args:
      - SHIELD=nrf7002ek
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  sample.wifi.nrf7002dk_wifi.conn.mqtt:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp/ns
    platform_allow: nrf7002dk/nrf5340/cpuapp/ns
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
  sample.wifi.nrf7002dk_wifi.conn.coap:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf7002dk/nrf5340/cpuapp/ns
    platform_allow: nrf7002dk/nrf5340/cpuapp/ns
    extra_args:
      - EXTRA_CONF_FILE="overlay_coap.conf"
    tags:
      - ci_build
      - sysbuild
      - ci_samples_wifi
